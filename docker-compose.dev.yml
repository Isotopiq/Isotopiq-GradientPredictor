# Dev compose: hot-reload for backend + frontend
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
services:
  backend:
    build:
      context: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 18700 --reload
    volumes:
      - ./backend:/app
      - models_data:/app/models
    ports:
      - "18700:18700"

  # In dev, use node:20 directly instead of the nginx production image
  frontend:
    image: node:20
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 18717"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "18717:18717"
    environment:
      - VITE_API_BASE_URL=http://localhost:18700/api/v1

volumes:
  models_data:
