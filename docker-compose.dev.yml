# Dev compose: hot-reload for backend + frontend
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
services:
  backend:
    build:
      context: ./backend
    command: sh -c "for i in 1 2 3 4 5; do alembic upgrade head && break || sleep 3; done && uvicorn app.main:app --host 0.0.0.0 --port 18700 --reload"
    volumes:
      - ./backend:/app
      - models_data:/app/models
    ports:
      - "18700:18700"
    environment:
      - APP_PORT=18700
      - CORS_ORIGINS=http://localhost:18717,http://localhost:18780,http://127.0.0.1:18717,http://localhost:5173

  # In dev, use node:20 directly instead of the nginx production image
  frontend:
    image: node:20
    build: !reset null
    working_dir: /app
    command: sh -c "rm -f /app/vite.config.js && npm ci && npm run dev -- --host 0.0.0.0 --port 18717"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "18717:18717"
    environment:
      - VITE_API_BASE_URL=/api/v1
      - VITE_PROXY_TARGET=http://backend:18700

volumes:
  models_data:
