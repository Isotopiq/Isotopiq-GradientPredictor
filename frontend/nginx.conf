server {
    # Unique port: 18780 (avoids conflicts with common web ports)
    listen 18780;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Allow large uploads (profile pictures, logos, training CSVs)
    client_max_body_size 15m;

    # WASM MIME type (needed for RDKit.js)
    location ~ \.wasm$ {
        types { application/wasm wasm; }
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy to backend (internal compose network, backend's unique port 18700)
    location /api/ {
        proxy_pass http://backend:18700;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
