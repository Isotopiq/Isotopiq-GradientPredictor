server {
    # Port is injected at runtime via envsubst: ${NGINX_PORT}
    # Default: 18780 (dev), Easypanel: 19180
    listen ${NGINX_PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Allow large uploads (mzXML/mzML up to the backend's 200 MB cap)
    client_max_body_size 250m;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # CSP: RDKit is self-hosted WASM (needs wasm-unsafe-eval); blob: needed
    # for generated downloads and the favicon; inline styles used by UI libs.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    # WASM MIME type (needed for RDKit.js)
    # NB: any add_header in a location disables server-level inheritance,
    # so nosniff is repeated here.
    location ~ \.wasm$ {
        types { application/wasm wasm; }
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy to backend (internal compose network)
    # Backend port is injected via envsubst: ${BACKEND_PORT}
    # Default: 18700 (dev), Easypanel: 19100
    location /api/ {
        proxy_pass http://backend:${BACKEND_PORT};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # mzXML uploads are large — don't time out mid-transfer
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
