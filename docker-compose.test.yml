# Test compose: ephemeral stack for e2e/integration tests
# Usage: docker compose -f docker-compose.test.yml up --abort-on-container-exit --exit-code-from e2e --build
#        docker compose -f docker-compose.test.yml down -v
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://test:test@db:5432/test
      JWT_SECRET: test-secret
      CORS_ORIGINS: http://localhost:18717
      MODEL_STORAGE_PATH: /app/test_models
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:18700/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  e2e:
    image: node:20
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm ci && npx playwright install --with-deps && npm run e2e"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - BASE_URL=http://backend:18700
