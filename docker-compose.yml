services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lcms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-lcms}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lcms}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # Unique host port 18732 -> container 5432 (for external DB tools like DBeaver/pgAdmin)
    ports:
      - "18732:5432"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-lcms}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-lcms}
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-long-random-string}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:18780,http://localhost:18717}
      MODEL_STORAGE_PATH: /app/models
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme-admin-2024!}
      APP_PORT: "18700"
    volumes:
      - models_data:/app/models
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:18700/api/v1/health')"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    restart: unless-stopped
    # Unique host port 18700 -> container 18700 (direct API + Swagger UI at /docs)
    ports:
      - "18700:18700"

  frontend:
    build: ./frontend
    environment:
      NGINX_PORT: "18780"
      BACKEND_PORT: "18700"
    depends_on:
      backend:
        condition: service_healthy
    # Unique host port 18780 -> container 18780 (SPA + nginx API proxy)
    ports:
      - "18780:18780"
    restart: unless-stopped

volumes:
  db_data:
  models_data:
